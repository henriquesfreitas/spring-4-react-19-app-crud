server {
    listen 80;

    # Serve the static files of the React application
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # This is the key for SPAs: if a file is not found, serve index.html.
        # This allows React Router to handle client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Strategy: Reverse proxy for API calls.
    # Any request to /api/... will be forwarded to the backend 'api' service.
    # 'api' is the service name defined in our docker-compose.yml.
    location /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strategy: Reverse proxy for WebSocket connections.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}