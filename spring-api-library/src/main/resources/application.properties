# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=spring-api-library

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.org.springframework.security=DEBUG

# ===================================================================
# Database Configuration
# These values MUST be provided via environment variables in production.
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# RabbitMQ Configuration (Defaults for local development)
# ===================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===================================================================
# Custom Application Properties
# ===================================================================
# This should be configured via environment variables in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# The JWT secret MUST be provided via an environment variable.
app.jwt.secret=${JWT_SECRET}
# JWT Expiration time in milliseconds (10 days)
app.jwt.expiration-ms=864000000

app.rabbitmq.exchange-name=book-exchange
app.rabbitmq.purchase-queue-name=book-purchase-queue
app.rabbitmq.purchase-routing-key=book.purchase.request
